<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none" stroke="#2C2520" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <title>Établi d'artisan</title>
  <!-- Plateau -->
  <path d="M 30 80 Q 150 75 270 80 L 270 95 Q 150 90 30 95 Z" fill="#F2EDE4" stroke="#2C2520"/>
  <!-- Pieds avant -->
  <line x1="55" y1="95" x2="55" y2="170"/>
  <line x1="245" y1="95" x2="245" y2="170"/>
  <!-- Pieds arrière (pointillés perspective) -->
  <line x1="75" y1="95" x2="75" y2="170" stroke-dasharray="3 3" stroke-width="1.2"/>
  <line x1="225" y1="95" x2="225" y2="170" stroke-dasharray="3 3" stroke-width="1.2"/>
  <!-- Traverse basse -->
  <line x1="55" y1="135" x2="245" y2="135" stroke-width="1.5"/>
  <!-- Étagère basse -->
  <line x1="55" y1="155" x2="245" y2="155"/>
  <!-- Étau gauche -->
  <rect x="35" y="60" width="14" height="22" fill="#6B7C5C" stroke="#2C2520"/>
  <circle cx="42" cy="71" r="2.5" fill="#2C2520"/>
  <!-- Outils sur plateau -->
  <line x1="100" y1="75" x2="135" y2="75" stroke="#6B7C5C" stroke-width="2"/>
  <circle cx="170" cy="76" r="3" fill="#6B7C5C" stroke="none"/>
  <!-- Sol -->
  <line x1="20" y1="175" x2="280" y2="175" stroke-width="1"/>
</svg>
